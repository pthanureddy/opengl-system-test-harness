image: python:3.12-slim

stages: [verify]

variables:
  LIBGL_ALWAYS_SOFTWARE: "1"
  MESA_GL_VERSION_OVERRIDE: "3.3"
  OPENGL_TEST_BACKEND: "egl"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths: [.cache/pip]

graphics-verification:
  stage: verify
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libegl1-mesa-dev mesa-utils
    - python -m pip install -e ".[dev]"
  script:
    - python -m ruff check .
    - python -m pytest --cov=opengl_system_test --cov-report=term --cov-report=xml --cov-fail-under=85
    - opengl-system-test run --config config/scenarios.json --output artifacts/ci --backend egl
    - python -m build
  artifacts:
    when: always
    reports:
      junit: artifacts/ci/report.junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - artifacts/ci/
      - dist/
    expire_in: 14 days
